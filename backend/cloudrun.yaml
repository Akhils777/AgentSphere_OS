apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: agentsphere-api
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
    spec:
      serviceAccountName: agentsphere-runtime
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/agentsphere/api:latest
          ports:
            - containerPort: 8080
          env:
            - name: GOOGLE_CLOUD_PROJECT
              value: PROJECT_ID
            - name: GOOGLE_GENAI_USE_VERTEXAI
              value: "true"
            - name: GOOGLE_CLOUD_LOCATION
              value: us-central1
            - name: GEMINI_MODEL
              value: gemini-2.5-flash
            - name: CORS_ORIGINS
              value: ""
            - name: ENVIRONMENT
              value: production
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
